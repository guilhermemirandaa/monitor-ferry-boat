name: Monitor Ferry Boat

# O bot roda em loop infinito (servidor + checagem a cada 5 min), então NÃO deve
# ser agendado a cada 5 min aqui: cada execução abriria mais um bot em paralelo,
# gerando alertas duplicados e gastando minutos do GitHub Actions.
# Ele está rodando localmente; deixe só a execução manual.
on:
  workflow_dispatch: # Botão para rodar manualmente quando quiser

jobs:
  rodar-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Puxar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install-deps chromium
          playwright install chromium

      - name: Executar o Robô
        env:
          USUARIO_SIGOM: ${{ secrets.USUARIO_SIGOM }}
          SENHA_SIGOM: ${{ secrets.SENHA_SIGOM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python Itaparica/bot_travessia.py
